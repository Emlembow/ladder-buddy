services:
  ladder:
    image: ladder-buddy/ladder:latest
    build:
      context: .
      dockerfile: docker/ladder-buddy/Dockerfile
      args:
        LADDER_REF: "${LADDER_REF:-main}"
    ports:
      - "127.0.0.1:${LADDER_PORT:-8080}:8080"
    environment:
      USERPASS: "${LADDER_USERPASS:-admin:change-me}"
      RULESET: "${LADDER_RULESET:-https://raw.githubusercontent.com/everywall/ladder-rules/main/ruleset.yaml}"
      LOG_URLS: "${LADDER_LOG_URLS:-false}"
      USER_AGENT: "${LADDER_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36}"
      ALLOW_REQUEST_USER_AGENT: "${LADDER_ALLOW_REQUEST_USER_AGENT:-true}"
      ALLOW_CUSTOM_USER_AGENT: "${LADDER_ALLOW_CUSTOM_USER_AGENT:-false}"
    restart: unless-stopped
